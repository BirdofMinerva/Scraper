name: Publish to npm

# Publishes @birdofminerva/scraper on a pushed v*.*.* tag (or a manual run).
# Gates on the unit tests, then publishes with provenance.
#
# Auth is OIDC "trusted publishing" — no long-lived token, nothing to bypass.
# One-time setup: in the package's settings on npmjs.com, add this repo and
# this workflow file as a trusted publisher. GitHub then mints a short-lived
# identity per run and npm accepts it; there is no secret to store.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC identity for trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24" # stable node:sqlite; matches the dev engine
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (gate)
        run: npm run test:unit

      # A recent npm is what negotiates the OIDC exchange with the registry.
      - name: Use latest npm
        run: npm install -g npm@latest

      # `prepublishOnly` builds dist/ first. No NODE_AUTH_TOKEN: publishing is
      # authorised by the OIDC identity above via the trusted-publisher config.
      - name: Publish
        run: npm publish --access public --provenance
